name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # На Linux x64 скрипт иначе качает CUDA с GitHub. Процессору она не нужна.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Типы
        run: npm run typecheck
      - name: Тесты
        run: npm test
